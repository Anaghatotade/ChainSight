version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: chainsight_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chainsight_user
      POSTGRES_PASSWORD: chainsight_pass
      POSTGRES_DB: chainsight_db
    ports:
      - "5432:5432"
    volumes:
      - chainsight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainsight_user -d chainsight_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chainsight_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://chainsight_user:chainsight_pass@db:5432/chainsight_db
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_supersecret_dev_key_please_rotate}
      CORS_ORIGINS: '["http://localhost:3000"]'
      FORCE_RESEED: ${FORCE_RESEED:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - chainsight_backend_cache:/root/.cache

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: chainsight_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  chainsight_pgdata:
  chainsight_backend_cache:
